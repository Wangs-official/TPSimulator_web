<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TFSimulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a
      class="github-corner"
      href="https://github.com/Wangs-official/TFSimulator_web"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="打开 GitHub 仓库"
    >
      <svg viewBox="0 0 250 250" aria-hidden="true">
        <path class="corner-bg" d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path
          class="octo-arm"
          d="M128.3,109 C113.8,99.7 119,89.6 119,89.6 C122,82.7 120.5,78.6 120.5,78.6 C119.2,72 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
        ></path>
        <path
          class="octo-body"
          d="M115,115 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88 127.5,74.4 143.8,58 C148.5,53.4 154,51.2 159.7,51 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96 205.4,96.6 C205.1,102.4 203,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
        ></path>
      </svg>
    </a>
    <main id="app">
      
      <section class="screen start-screen active" data-screen="start">
        <button class="settings-button" id="settingsBtn" type="button">设置</button>
        <div class="start-panel">
          <h1>双绞线线序练习</h1>
          <div class="standard-picker" role="radiogroup" aria-label="选择线序标准">
            <label>
              <input type="radio" name="standard" value="T568A" checked />
              <span>T568A线序</span>
            </label>
            <label>
              <input type="radio" name="standard" value="T568B" />
              <span>T568B线序</span>
            </label>
          </div>
          <button class="play-button" id="startBtn" type="button" aria-label="开始练习">
            <span></span>
          </button>
          <button class="outline-button home-rank-button" id="homeRankBtn" type="button">排行榜</button>
        </div>
      </section>

      <section class="screen arrange-screen" data-screen="arrange">
        <div class="arrange-top">
          <div class="arrange-actions">
            <h2 id="arrangeTitle">排列T568A线序</h2>
            <div class="timer" id="timer">00:00</div>
            <button class="primary-button" id="finishBtn" type="button">排列完成</button>
          </div>
          <div class="instructions">
            <h2>使用说明</h2>
            <p>屏幕下方使用带色线条模拟双绞线，使用鼠标拖动他们到正确的线序位置，然后点击“排列完成”，获得结果</p>
          </div>
        </div>
        <div class="wire-stage" id="wireStage" aria-label="拖动线条排序"></div>
      </section>

      <section class="screen result-screen" data-screen="result">
        <div class="result-layout">
          <div class="result-wires">
            <div id="resultWireList"></div>
            <div class="result-standard" id="resultStandard">T568A</div>
          </div>
          <div class="result-summary">
            <div class="metrics">
              <div>用时 <strong id="resultTime">00:00</strong></div>
              <div>准确率 <strong id="resultAccuracy">0%</strong></div>
            </div>
            <h2 id="aiSuggestion">这里显示AI建议</h2>
          </div>
        </div>
        <div class="result-actions">
          <button class="primary-button wide" id="submitScoreBtn" type="button">提交成绩</button>
          <button class="outline-button" id="retryBtn" type="button">再来一次</button>
          <button class="outline-button" id="rankBtn" type="button">排行榜</button>
        </div>
      </section>

      <section class="screen leaderboard-screen" data-screen="leaderboard">
        <h1>排行榜</h1>
        <div class="leaderboard-list" id="leaderboardList"></div>
        <button class="outline-button back-button" id="backBtn" type="button">返回</button>
      </section>
    </main>
    <div class="settings-modal" id="settingsModal" aria-hidden="true">
      <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">API Token 设置</h2>
        <label class="token-field">
          <span>API Token</span>
          <input id="apiTokenInput" type="password" autocomplete="off" placeholder="请输入 API Token" />
        </label>
        <div class="settings-status" id="settingsStatus"></div>
        <div class="settings-actions">
          <button class="outline-button compact" id="clearTokenBtn" type="button">清空</button>
          <button class="outline-button compact" id="closeSettingsBtn" type="button">取消</button>
          <button class="primary-button compact" id="saveTokenBtn" type="button">保存</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
